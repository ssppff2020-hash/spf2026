# C1 翻译流水线配置
#
# 换一门课时，通常只需要改这一份文件（外加在 source/manifest 里登记条目）。
# 所有脚本都从命令行参数或本文件取路径，不硬编码课程名。

challenge:
  id: C1
  course: "CS146S The Modern Software Developer"
  institution: "Stanford University"
  term: "Fall 2025"
  source_site: "https://themodernsoftware.dev/"
  captured: "2026-04-02"

paths:
  # 输入
  cache_dir: "materials/_work/CS146S_offline"   # 离线缓存解压目录
  pdf_dir: "materials"                          # 原始 PDF 所在目录
  live_dir: "materials/_work/live"              # 步骤 1 补抓的产物
  extracted_dir: "materials/_work/extracted"    # 步骤 2 的 HTML→文本产物
  extracted_pdf_dir: "materials/_work/extracted_pdf"
  source_dir: "materials/_work/source"          # 步骤 3 归一化后的原文语料
  # 输出
  output_dir: "C1/翻译"                          # 译稿
  glossary: "C1/glossary.csv"
  qa_report: "C1/pipeline/qa_report.md"
  manifest: "materials/_work/source/manifest.json"

extraction:
  # 步骤 2 的行为开关
  drop_tags: [script, style, noscript, svg, nav, footer, header, form,
              iframe, template, button, aside, menu, dialog]
  content_root_tags: [main, article]   # 优先只抽这些容器内的文本
  content_root_min_html: 1500          # 容器 HTML 太短就视为侧栏卡片，放弃
  content_root_min_ratio: 0.6          # 容器文本至少占全文这么多才采信
  placeholder_chars: 200               # 文本短于此视为占位/空页

pdf_extraction:
  # 步骤 2b 的行为开关
  engines: [pymupdf, poppler]   # 两个都跑，按健全性打分择优选
  doubled_alarm: 0.10           # "重复词"占比超过此值即判该引擎输出损坏
  # 背景：本语料中 poppler 把 how-anthropic-uses-claude-code.pdf 的每个字母
  # 抽了两遍（重复率 25.5%）且少抽 33% 内容，不报错、看起来仍像正常英文。

translation:
  # 步骤 4 的约束
  spec: "C1/pipeline/04_translate_prompt.md"
  batch_max_chars: 55000     # 单批原文上限，超过就拆批
  cn_chars_per_en_word: 1.3  # 经验比值，用于篇幅校验
  qa_floor_ratio: 0.75       # 中文字符数 / (原文词数×比值) 的下限

qa:
  coverage_target: 0.80      # 验收要求：覆盖度 ≥ 80%
  structure_floor: 0.70      # 译文小节数 / 原文小节数 的下限
